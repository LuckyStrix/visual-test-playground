name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[test]
      - run: python -m pytest visual_test/ -q
      - run: python -m ruff check visual_test/
      - run: python -m ruff format --check visual_test/
      - run: python -m mypy visual_test/

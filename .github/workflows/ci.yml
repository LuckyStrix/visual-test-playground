name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[test]
      - run: python -m pytest visual_test/ -q
      - run: python -m ruff check visual_test/
      - run: python -m mypy visual_test/
